<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <title>Blog Preview Card</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }
    body
    {
        background-color: #efda7a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    
    }
    div{
        background-color: white;
        width: 300px;
        height: 70vh;
        text-align: start;
        border-radius: 20px;
        padding: 10px;
        border: 1px solid black;
        box-shadow: 8px 8px black;
    }
    a{
        
    }
    .p1{
        
        display: inline-block;
        font-size: 14px;
        color: rgba(0, 0, 0, 0.578);
    }
    button{
        background-color: #efda7a;
        border: none;
        height: 20px;
        font-size: 10px;
        font-weight: bold;
        width: 60px;
        border-radius: 3px;

    }
    .p2
    {
      font-size: 10px;
      padding: 8px 0 10px 0;
    }
    h4{
        font-weight: bold;
        font-family: Arial, Helvetica, sans-serif;
        padding: 0 0 15px 0;
    }
    p{
        font-size: 12px;
        font-weight: bold;
    }
    footer{
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
        

    }
</style>
<body>
    <div>
        <img src="./assets/images/illustration-article.svg" alt="article image" width="100%">
        <button>Learning</button>

    <main>
        <p class="p2">Published 21 Dec 2023 </p>
        <h4>HTML & CSS foundations
        </h4>

        <p class="p1">
             These languages are the backbone of every website, defining structure, content, and presentation.
        </p>
    </main>
    <footer>
        <img src="./assets/images/image-avatar.webp" alt="avatar" width="30">
        <p>Greg Hooper</p>
    </footer>
    </div>
    
</body>
</html>
